[package]
name = "circuit_bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "circuit_bench"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "=0.27.2"
egui_plot = "=0.27.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.29"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
